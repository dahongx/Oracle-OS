; 测试目的: 不依赖任何显示库,用最原始的 SPI 命令读一下屏幕的 Read Display ID (0x04),
;          先确认 CS/DC/SCK/MOSI/RST 这几根线电气上是通的、屏幕控制器有反应,
;          再决定用 ST7789 还是 ILI9341 的配置去做真正的点亮测试
;          (esp32s3_lcd_fill_test 工程)。
;
; 说明: 国产/山寨屏幕的 Read ID 返回值经常和数据手册标称值对不上,
;      这里的判断标准主要是"有没有非 0x00 / 非 0xFF 的响应",
;      而不是精确比对某个厂家 ID。真正的验证还是要看 fill_test 能不能点亮出图案。

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 921600
