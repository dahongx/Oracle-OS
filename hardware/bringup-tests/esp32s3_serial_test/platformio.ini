; PlatformIO 工程配置
; 板子: ESP32-S3-WROOM-1-N8R2 (8MB Flash / 2MB PSRAM)
; USB : ESP32-S3 原生 USB(USB Serial/JTAG),板上没有额外的 USB转串口桥接芯片(如 CH340/CP2102)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- 关键配置:让 Arduino 的 Serial 对象走芯片原生 USB CDC ---
; ARDUINO_USB_MODE=1        : 使用 USB-OTG 原生模式(而不是 USB-UART 桥接模式)
; ARDUINO_USB_CDC_ON_BOOT=1 : 上电启动阶段就把 Serial 挂到 USB CDC 上,
;                             这样一插上 USB 就能在电脑上看到虚拟串口,并从 setup() 最开始就能打印
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 921600

; 如果自动进入下载模式失败(没有自动下载电路),
; 需要手动:按住 BOOT(GPIO0接GND) -> 按一下 RESET(EN) -> 松开 BOOT -> 再执行上传

; --------------------------------------------------------------------------
; 备用环境: 走传统 UART0(不走原生 USB CDC)
; 用于实测发现电脑上出现的是 "CH340" 串口,而不是 S3 原生 USB 的情况 ——
; 说明实际是通过板上 J3 排针(TXD0/RXD0/GND)接了一个外置 USB转串口(CH340)小板,
; 而不是插在板子自己的 USB Type-C 口上。这种接法下 Serial 应该走普通 UART0,
; 不能用原生 USB CDC 的宏,否则打印内容不会出现在这个 CH340 端口上。
[env:esp32-s3-uart]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; 不加 ARDUINO_USB_MODE / ARDUINO_USB_CDC_ON_BOOT,Serial 默认走硬件 UART0(GPIO43/44)
