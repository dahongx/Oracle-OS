; 测试目的: 通过 I2C 初始化 DRV2605L 触觉驱动芯片,播放内置震动效果,
;          确认 M+/M- 输出到线性马达的链路是好的。
;
; 注意: DRV2605L 需要先做 I2C 寄存器配置(选波形库、选内置 effect)才会输出到马达,
;      不能只靠通电就测出来,所以这里必须走一点点驱动代码。

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit DRV2605 Library @ ^1.2.3

monitor_speed = 115200
upload_speed = 921600
