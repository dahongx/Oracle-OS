; 测试目的: 用 TFT_eSPI 库真正把屏幕点亮,循环填充几种颜色 + 显示文字,
;          肉眼确认屏幕能不能正常显示画面(而不只是背光亮)。
;
; 引脚已根据原理图(MCU.SchDoc)核实:
;   LCD_CS=GPIO9  LCD_DC=GPIO10  LCD_SCL(SCK)=GPIO11  LCD_SDA(MOSI)=GPIO12
;   LCD_RST=GPIO13  LCD_BLK=GPIO14   (MISO 未接)
;
; 数据手册里这块 2.8寸屏 ST7789V / ILI9341V 二选一(具体看贴片是哪颗芯片),
; 所以这里建了两个 env,先烧 lcd_st7789,画面不对/花屏的话,
; 改烧 lcd_ili9341 试试(两个都编译好了,只是选哪个跑而已,不用改代码)。

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; ---- TFT_eSPI 配置(全部通过宏传入,不需要改库里的 User_Setup.h) ----
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=12
    -D TFT_SCLK=11
    -D TFT_CS=9
    -D TFT_DC=10
    -D TFT_RST=13
    -D TFT_BL=14
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=27000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1

; 优先试这个:数据手册列出的第一顺位型号
[env:lcd_st7789]
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1

; 如果 st7789 花屏/不显示,改烧这个
[env:lcd_ili9341]
build_flags =
    ${env.build_flags}
    -D ILI9341_DRIVER=1
